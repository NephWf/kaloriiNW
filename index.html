<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Калории — дневник питания</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050807" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Калории" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="greeting">Дневник</p>
        <h1 id="page-title">Сегодня</h1>
      </div>
      <button class="icon-btn" id="btn-profile" type="button" aria-label="Профиль">
        <span id="avatar-letter">Я</span>
      </button>
    </header>
    <button class="install-banner hidden" id="btn-install" type="button">Установить на телефон</button>

    <main class="content" id="view-today">
      <section class="date-row">
        <button class="icon-btn ghost" id="prev-day" type="button" aria-label="Предыдущий день">‹</button>
        <button class="date-chip" id="date-label" type="button">Сегодня</button>
        <button class="icon-btn ghost" id="next-day" type="button" aria-label="Следующий день">›</button>
      </section>

      <section class="hero card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 140 140" aria-hidden="true">
            <circle class="ring-bg" cx="70" cy="70" r="54" />
            <circle class="ring-fg" id="cal-ring" cx="70" cy="70" r="54" />
          </svg>
          <div class="ring-center">
            <strong id="cal-left">0</strong>
            <span id="cal-left-label">осталось</span>
          </div>
        </div>
        <div class="hero-meta">
          <div>
            <span class="muted">Цель</span>
            <b id="cal-goal">0</b>
          </div>
          <div>
            <span class="muted">Съедено</span>
            <b id="cal-eaten">0</b>
          </div>
          <div>
            <span class="muted">Сожжено</span>
            <b id="cal-burned">0</b>
          </div>
        </div>
      </section>

      <section class="macros">
        <article class="macro card">
          <div class="macro-head">
            <span>Белки</span>
            <b id="p-text">0 / 0 г</b>
          </div>
          <div class="bar"><i id="p-bar"></i></div>
        </article>
        <article class="macro card">
          <div class="macro-head">
            <span>Жиры</span>
            <b id="f-text">0 / 0 г</b>
          </div>
          <div class="bar fat"><i id="f-bar"></i></div>
        </article>
        <article class="macro card">
          <div class="macro-head">
            <span>Углеводы</span>
            <b id="c-text">0 / 0 г</b>
          </div>
          <div class="bar carb"><i id="c-bar"></i></div>
        </article>
      </section>

      <section class="water card">
        <div class="water-head">
          <div>
            <h2>Вода</h2>
            <p class="muted"><span id="water-now">0</span> / <span id="water-goal">8</span> стаканов</p>
          </div>
          <button class="pill" id="add-water" type="button">+ стакан</button>
        </div>
        <div class="glasses" id="glasses"></div>
      </section>

      <section class="meals" id="meals"></section>
      <button class="cheat-dock" id="cheat-dock" type="button" role="switch" aria-checked="false">
        <span>
          <b>Чит-мил</b>
          <small id="cheat-hint">Калории за этот день не пойдут в норму</small>
        </span>
        <i class="switch" aria-hidden="true"></i>
      </button>
    </main>

    <main class="content hidden" id="view-foods">
      <div class="search-box card">
        <input id="food-search" type="search" placeholder="Найти продукт…" autocomplete="off" />
      </div>
      <div class="chips" id="food-cats"></div>
      <div id="food-list"></div>
    </main>

    <main class="content hidden" id="view-stats">
      <section class="card week-card">
        <h2>Последние 7 дней</h2>
        <div class="week-bars" id="week-bars"></div>
      </section>
      <section class="stats-grid" id="stats-grid"></section>
    </main>

    <main class="content hidden" id="view-profile">
      <section class="card form-card">
        <h2>Профиль</h2>
        <label>Имя
          <input id="p-name" type="text" maxlength="24" />
        </label>
        <div class="two">
          <label>Пол
            <select id="p-sex">
              <option value="female">Женский</option>
              <option value="male">Мужской</option>
            </select>
          </label>
          <label>Возраст
            <input id="p-age" type="number" min="12" max="90" />
          </label>
        </div>
        <div class="two">
          <label>Рост, см
            <input id="p-height" type="number" min="120" max="230" />
          </label>
          <label>Вес, кг
            <input id="p-weight" type="number" min="30" max="250" step="0.1" />
          </label>
        </div>
        <label>Активность
          <select id="p-activity">
            <option value="inactive">Сидячий образ жизни</option>
            <option value="low">Лёгкая активность</option>
            <option value="active">Средняя активность</option>
            <option value="very">Высокая активность</option>
          </select>
        </label>
        <label>Цель
          <select id="p-aim">
            <option value="lose">Похудение</option>
            <option value="keep">Поддержание веса</option>
            <option value="gain">Набор массы</option>
          </select>
        </label>
        <p class="hint" id="tdee-hint">Расчётная норма появится здесь</p>
        <button class="btn primary" id="calc-goal" type="button">Рассчитать норму</button>
      </section>

      <section class="card form-card">
        <h2>Цели вручную</h2>
        <label>Калории, ккал
          <input id="g-cal" type="number" min="800" max="6000" />
        </label>
        <div class="two">
          <label>Белки, г
            <input id="g-p" type="number" min="20" max="400" />
          </label>
          <label>Жиры, г
            <input id="g-f" type="number" min="20" max="250" />
          </label>
        </div>
        <label>Углеводы, г
          <input id="g-c" type="number" min="20" max="600" />
        </label>
        <label>Стаканов воды в день
          <input id="g-water" type="number" min="4" max="16" />
        </label>
        <button class="btn" id="save-goals" type="button">Сохранить цели</button>
      </section>

      <section class="card form-card">
        <h2>Данные</h2>
        <button class="btn danger" id="reset-day" type="button">Очистить выбранный день</button>
        <button class="btn ghost-btn" id="reset-all" type="button">Сбросить всё приложение</button>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="today" type="button">
        <span>⌂</span>День
      </button>
      <button class="tab" data-view="foods" type="button">
        <span>⌕</span>Продукты
      </button>
      <button class="tab" data-view="stats" type="button">
        <span>▤</span>Статистика
      </button>
      <button class="tab" data-view="profile" type="button">
        <span>●</span>Профиль
      </button>
    </nav>
  </div>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-backdrop" id="sheet-close"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
